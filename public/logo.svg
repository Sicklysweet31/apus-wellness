<svg viewBox="0 0 160 88" xmlns="http://www.w3.org/2000/svg" fill="none">

  <!-- Topographic contour lines — 5 layers, outermost faint, innermost full gold -->
  <path d="M 10,54 L 80,8  L 150,54" stroke="#C4873A" stroke-width="0.8" stroke-linejoin="miter" stroke-opacity="0.2"/>
  <path d="M 22,54 L 80,16 L 138,54" stroke="#C4873A" stroke-width="0.8" stroke-linejoin="miter" stroke-opacity="0.38"/>
  <path d="M 34,54 L 80,24 L 126,54" stroke="#C4873A" stroke-width="0.8" stroke-linejoin="miter" stroke-opacity="0.56"/>
  <path d="M 46,54 L 80,32 L 114,54" stroke="#C4873A" stroke-width="0.85" stroke-linejoin="miter" stroke-opacity="0.75"/>
  <path d="M 58,54 L 80,40 L 102,54" stroke="#C4873A" stroke-width="0.9" stroke-linejoin="miter"/>

  <!-- Peak dot -->
  <circle cx="80" cy="40" r="1.5" fill="#C4873A"/>

  <!-- APUS wordmark -->
  <text
    x="80" y="71"
    font-family="'Cormorant Garamond', Georgia, serif"
    font-weight="300"
    font-size="24"
    letter-spacing="9"
    fill="#C4873A"
    text-anchor="middle"
  >APUS</text>

  <!-- WELLNESS -->
  <text
    x="80" y="85"
    font-family="'Jost', Arial, sans-serif"
    font-weight="300"
    font-size="7.5"
    letter-spacing="5"
    fill="#8B7355"
    text-anchor="middle"
  >WELLNESS</text>

</svg>
