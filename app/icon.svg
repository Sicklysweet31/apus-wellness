<svg viewBox="0 0 100 58" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Background -->
  <rect width="100" height="58" fill="#1C2120"/>

  <defs>
    <clipPath id="sun-clip">
      <rect x="0" y="0" width="100" height="40"/>
    </clipPath>
  </defs>

  <!-- Giant sun -->
  <circle cx="50" cy="40" r="28" stroke="#C4873A" stroke-width="1.2" clip-path="url(#sun-clip)"/>
  <circle cx="50" cy="40" r="21" stroke="#C4873A" stroke-width="0.5" stroke-opacity="0.3" clip-path="url(#sun-clip)"/>

  <!-- Three mountains — solid fill -->
  <path d="M 0,40  L 20,18 L 36,40 Z"  fill="#1C2120" stroke="#C4873A" stroke-width="1.2" stroke-linejoin="miter"/>
  <path d="M 28,40 L 50,8  L 72,40 Z"  fill="#1C2120" stroke="#C4873A" stroke-width="1.5" stroke-linejoin="miter"/>
  <path d="M 64,40 L 80,18 L 100,40 Z" fill="#1C2120" stroke="#C4873A" stroke-width="1.2" stroke-linejoin="miter"/>
</svg>
