<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none">
  <rect width="64" height="64" fill="#1C2120"/>

  <defs>
    <clipPath id="horizon">
      <rect x="0" y="0" width="64" height="42"/>
    </clipPath>
  </defs>

  <!-- Sun, clipped at the horizon -->
  <circle cx="32" cy="42" r="17" stroke="#C4873A" stroke-width="2" clip-path="url(#horizon)"/>
  <circle cx="32" cy="42" r="11.5" stroke="#C4873A" stroke-width="1" stroke-opacity="0.35" clip-path="url(#horizon)"/>

  <!-- Three mountains, center tallest, solid fill blocks the sun -->
  <path d="M 4,42  L 17,25 L 29,42 Z"  fill="#1C2120" stroke="#C4873A" stroke-width="2"   stroke-linejoin="miter"/>
  <path d="M 22,42 L 32,13 L 42,42 Z"  fill="#1C2120" stroke="#C4873A" stroke-width="2.4" stroke-linejoin="miter"/>
  <path d="M 35,42 L 47,25 L 60,42 Z"  fill="#1C2120" stroke="#C4873A" stroke-width="2"   stroke-linejoin="miter"/>
</svg>
